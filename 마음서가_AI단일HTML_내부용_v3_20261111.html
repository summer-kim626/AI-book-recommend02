<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마음 서가</title>
  <!-- 예전 주소. 마음 서가는 사이트 첫 주소(index.html)로 옮겼다. 예전 링크가 끊기지 않도록 넘겨 준다. -->
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://summer-kim626.github.io/AI-book-recommend02/">
  <meta http-equiv="refresh" content="0; url=./">
  <!-- #ai 같은 탭 주소를 유지한 채 넘긴다 (스크립트가 꺼져 있으면 위 refresh가 넘긴다) -->
  <script>location.replace("./" + location.hash);</script>
</head>
<body>
  <p><a href="./">마음 서가로 이동</a></p>
</body>
</html>
