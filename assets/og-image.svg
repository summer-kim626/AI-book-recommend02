      <rect x="748" y="394" width="70" height="4" fill="#ffffff" opacity="0.5"/>
    </g>
    <g transform="rotate(6 1080 430)">
      <rect x="990" y="210" width="150" height="230" rx="8" fill="#c9774f"/>
      <rect x="990" y="210" width="12" height="230" rx="4" fill="#ffffff" opacity="0.18"/>
      <text x="1018" y="256" font-size="28">설렘</text>
      <rect x="1018" y="404" width="70" height="4" fill="#ffffff" opacity="0.5"/>
    </g>
    <g>
      <rect x="845" y="160" width="170" height="260" rx="8" fill="#1f6f78"/>
      <rect x="845" y="160" width="14" height="260" rx="4" fill="#ffffff" opacity="0.18"/>
      <text x="876" y="212" font-size="32">위로</text>
      <path d="M930 330c-4.2-3.2-13.5-9.7-13.5-17.3 0-4.4 3.4-7.8 7.4-7.8 2.7 0 4.9 1.3 6.1 3.4 1.2-2.1 3.4-3.4 6.1-3.4 4 0 7.4 3.4 7.4 7.8 0 7.6-9.3 14.1-13.5 17.3z" fill="#e0675b"/>
      <rect x="876" y="384" width="80" height="4" fill="#ffffff" opacity="0.5"/>
    </g>
    <rect x="690" y="452" width="480" height="10" rx="5" fill="#1d2733" opacity="0.08"/>
