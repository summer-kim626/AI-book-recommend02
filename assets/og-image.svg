<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 공유 썸네일 원본. 수정 후 다시 렌더링:
       rsvg-convert -w 1200 -h 630 assets/og-image.svg -o assets/og-image.png
       글꼴: 제목 AppleMyungjo(명조), 본문 Pretendard. 다른 컴퓨터에서는 대체 글꼴로 그려질 수 있다. -->
  <rect width="1200" height="630" fill="#f3f5f7"/>
  <circle cx="930" cy="330" r="250" fill="#e1f0f1"/>

  <!-- 왼쪽 글 -->
  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
    <rect x="90" y="96" width="268" height="48" rx="24" fill="none" stroke="#1f6f78" stroke-width="2"/>
    <text x="224" y="128" text-anchor="middle" font-size="22" font-weight="700" fill="#1f6f78">AI 감정 독서 큐레이션</text>

    <text x="86" y="282" font-family="AppleMyungjo, 'Noto Serif KR', serif" font-size="124" fill="#1d2733">마음 서가</text>

    <text x="90" y="356" font-size="34" fill="#5d6b7a">지금 감정을 고르거나 적으면</text>
    <text x="90" y="404" font-size="34" fill="#5d6b7a">어울리는 책 3권을 추천해 드려요</text>

    <g font-size="24" font-weight="700" fill="#1f6f78">
      <rect x="90" y="452" width="92" height="46" rx="23" fill="#ffffff" stroke="#d9e0e7" stroke-width="2"/>
      <text x="136" y="483" text-anchor="middle">불안</text>
      <rect x="196" y="452" width="116" height="46" rx="23" fill="#ffffff" stroke="#d9e0e7" stroke-width="2"/>
      <text x="254" y="483" text-anchor="middle">외로움</text>
      <rect x="326" y="452" width="92" height="46" rx="23" fill="#ffffff" stroke="#d9e0e7" stroke-width="2"/>
      <text x="372" y="483" text-anchor="middle">설렘</text>
      <rect x="432" y="452" width="116" height="46" rx="23" fill="#ffffff" stroke="#d9e0e7" stroke-width="2"/>
      <text x="490" y="483" text-anchor="middle">번아웃</text>
    </g>

    <text x="90" y="566" font-size="22" fill="#8a97a5">aipm-emotion-book-store.web.app</text>
  </g>

  <!-- 오른쪽 책 세 권 -->
  <g font-family="AppleMyungjo, 'Noto Serif KR', serif" fill="#ffffff">
    <g transform="rotate(-8 790 420)">
      <rect x="720" y="200" width="150" height="230" rx="8" fill="#2e5e4e"/>
      <rect x="720" y="200" width="12" height="230" rx="4" fill="#ffffff" opacity="0.18"/>
